services:
  # --- 1. Database: PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: banking_postgres
    restart: always
    environment:
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
      POSTGRES_DB: banking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. Backend: FastAPI Application ---
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: banking_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://banking_user:banking_password@postgres:5432/banking_db
      USE_MOCK_AGENT: "${USE_MOCK_AGENT:-false}"
      USE_MOCK_SECURITY: "${USE_MOCK_SECURITY:-false}"
      USE_MOCK_SUBSCRIPTIONS: "${USE_MOCK_SUBSCRIPTIONS:-false}"
      AGENT_PROVIDER: "${AGENT_PROVIDER:-mock}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-lite}"
      AGENT_TIMEOUT_SECONDS: "${AGENT_TIMEOUT_SECONDS:-20}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # --- 3. Frontend: React App served via Nginx ---
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: banking_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
